search_queries: []

autocli_sources:
  - name: Boss直聘 — AI ToB销售
    platform: boss
    enabled: true
    command:
      - C:\finding_worker\career-ops\autocli-bin\autocli.exe
      - boss
      - search
      - AI ToB 销售 深圳
      - --limit
      - "20"
      - --format
      - json
    fields:
      title: name
      url: url
      company: company
      location: area
      detail_id: security_id
    detail_command:
      - C:\finding_worker\career-ops\autocli-bin\autocli.exe
      - boss
      - detail
      - "{{offer.detailId}}"
      - --format
      - json
    detail_fields:
      description: description

